<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>MIDI Canvas</title>
    <style>
        :root {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #f5f5f5;
            background: #090909;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: #090909;
        }

        button, select { font: inherit; }

        .app {
            display: grid;
            grid-template-columns: minmax(280px, 360px) 1fr;
            min-height: 100vh;
        }

        .panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 28px;
            border-right: 1px solid #252525;
            background: #111;
        }

        .eyebrow {
            margin: 0 0 6px;
            color: #929292;
            font-size: 12px;
            letter-spacing: .14em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(28px, 4vw, 42px);
            line-height: 1;
        }

        .description {
            margin: 0;
            color: #aaa;
            line-height: 1.55;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #b7b7b7;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #555;
        }

        .status[data-state="connected"] .status-dot {
            background: #52d273;
            box-shadow: 0 0 16px rgba(82, 210, 115, .4);
        }

        .button {
            min-height: 48px;
            border: 0;
            border-radius: 12px;
            padding: 0 18px;
            color: #111;
            background: #f5f5f5;
            cursor: pointer;
            font-weight: 700;
        }

        .button:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        .field {
            display: grid;
            gap: 8px;
        }

        .field label,
        .field-title {
            color: #929292;
            font-size: 13px;
        }

        select {
            width: 100%;
            min-height: 44px;
            border: 1px solid #343434;
            border-radius: 10px;
            padding: 0 12px;
            color: #f5f5f5;
            background: #191919;
        }

        .mode-switch {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 6px;
            padding: 5px;
            border: 1px solid #2b2b2b;
            border-radius: 12px;
            background: #171717;
        }

        .mode-button {
            min-height: 40px;
            border: 0;
            border-radius: 8px;
            padding: 0 8px;
            color: #999;
            background: transparent;
            cursor: pointer;
            font-weight: 650;
        }

        .mode-button[aria-pressed="true"] {
            color: #111;
            background: #f5f5f5;
        }

        .monitor {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .metric {
            min-width: 0;
            padding: 14px;
            border: 1px solid #292929;
            border-radius: 12px;
            background: #171717;
        }

        .metric span {
            display: block;
            margin-bottom: 6px;
            color: #777;
            font-size: 11px;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .metric strong {
            display: block;
            overflow: hidden;
            color: #fff;
            font-size: 20px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .message {
            min-height: 44px;
            margin-top: auto;
            color: #858585;
            font-size: 13px;
            line-height: 1.45;
        }

        .visual {
            position: relative;
            min-width: 0;
            min-height: 100vh;
            overflow: hidden;
            background: #050505;
        }

        .visual:fullscreen,
        .visual:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
            min-height: 100vh;
            background: #050505;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .visual-label {
            position: absolute;
            top: 20px;
            right: 78px;
            pointer-events: none;
            color: rgba(255,255,255,.3);
            font-size: 12px;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        .fullscreen-button {
            position: absolute;
            top: 14px;
            right: 16px;
            z-index: 3;
            display: grid;
            width: 44px;
            height: 44px;
            place-items: center;
            border: 1px solid rgba(255,255,255,.14);
            border-radius: 12px;
            color: rgba(255,255,255,.82);
            background: rgba(18,18,18,.68);
            backdrop-filter: blur(12px);
            cursor: pointer;
        }

        .fullscreen-button:hover { background: rgba(34,34,34,.86); }
        .fullscreen-button svg { width: 20px; height: 20px; }

        .visual:fullscreen .visual-label,
        .visual:-webkit-full-screen .visual-label { opacity: 0; }

        .visual:fullscreen .fullscreen-button,
        .visual:-webkit-full-screen .fullscreen-button { opacity: .32; }

        .visual:fullscreen .fullscreen-button:hover,
        .visual:-webkit-full-screen .fullscreen-button:hover { opacity: 1; }

        @media (max-width: 820px) {
            .app { grid-template-columns: 1fr; }
            .panel {
                border-right: 0;
                border-bottom: 1px solid #252525;
            }
            .visual { min-height: 58vh; }
        }
    </style>
</head>
<body>
    <main class="app">
        <section class="panel">
            <div>
                <p class="eyebrow">Web MIDI experiment</p>
                <h1>MIDI Canvas</h1>
            </div>

            <p class="description">Підключи цифрове піаніно через USB, дозволь браузеру доступ до MIDI та зіграй кілька нот.</p>

            <div class="status" id="status" data-state="disconnected">
                <span class="status-dot"></span>
                <span id="statusText">MIDI не підключено</span>
            </div>

            <button class="button" id="connectButton" type="button">Підключити MIDI</button>

            <div class="field">
                <label for="deviceSelect">MIDI input</label>
                <select id="deviceSelect" disabled>
                    <option value="">Немає доступних пристроїв</option>
                </select>
            </div>

            <div class="field">
                <div class="field-title">Візуалізація</div>
                <div class="mode-switch" aria-label="Режим візуалізації">
                    <button class="mode-button" type="button" data-mode="spots" aria-pressed="true">Плями</button>
                    <button class="mode-button" type="button" data-mode="lines" aria-pressed="false">Лінії</button>
                    <button class="mode-button" type="button" data-mode="rain" aria-pressed="false">Дощ</button>
                </div>
            </div>

            <div class="monitor">
                <div class="metric"><span>Event</span><strong id="eventValue">—</strong></div>
                <div class="metric"><span>Note</span><strong id="noteValue">—</strong></div>
                <div class="metric"><span>MIDI</span><strong id="midiValue">—</strong></div>
                <div class="metric"><span>Velocity</span><strong id="velocityValue">—</strong></div>
            </div>

            <div class="message" id="message">Для Web MIDI відкрий сторінку в Chrome або Edge через HTTPS або localhost.</div>
        </section>

        <section class="visual" id="visual">
            <canvas id="canvas"></canvas>
            <div class="visual-label" id="visualLabel">Live visual · Плями</div>
            <button class="fullscreen-button" id="fullscreenButton" type="button" aria-label="Відкрити візуалізацію на весь екран" title="На весь екран">
                <svg id="fullscreenIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M8 3H3v5"></path>
                    <path d="M16 3h5v5"></path>
                    <path d="M8 21H3v-5"></path>
                    <path d="M16 21h5v-5"></path>
                </svg>
            </button>
        </section>
    </main>

    <script>
        const connectButton = document.getElementById('connectButton')
        const deviceSelect = document.getElementById('deviceSelect')
        const status = document.getElementById('status')
        const statusText = document.getElementById('statusText')
        const eventValue = document.getElementById('eventValue')
        const noteValue = document.getElementById('noteValue')
        const midiValue = document.getElementById('midiValue')
        const velocityValue = document.getElementById('velocityValue')
        const message = document.getElementById('message')
        const visual = document.getElementById('visual')
        const visualLabel = document.getElementById('visualLabel')
        const canvas = document.getElementById('canvas')
        const fullscreenButton = document.getElementById('fullscreenButton')
        const fullscreenIcon = document.getElementById('fullscreenIcon')
        const modeButtons = Array.from(document.querySelectorAll('.mode-button'))
        const context = canvas.getContext('2d')

        let midiAccess = null
        let selectedInput = null
        let visualizationMode = 'spots'
        let particles = []
        let strokes = []
        let rainDrops = []
        let width = 0
        let height = 0
        let pixelRatio = 1

        const noteNames = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B']

        function noteName(note) {
            const octave = Math.floor(note / 12) - 1
            return `${noteNames[note % 12]}${octave}`
        }

        function setStatus(connected, text) {
            status.dataset.state = connected ? 'connected' : 'disconnected'
            statusText.textContent = text
        }

        function resizeCanvas() {
            const rect = visual.getBoundingClientRect()
            pixelRatio = Math.min(window.devicePixelRatio || 1, 2)
            width = Math.max(1, Math.round(rect.width))
            height = Math.max(1, Math.round(rect.height))
            canvas.width = Math.round(width * pixelRatio)
            canvas.height = Math.round(height * pixelRatio)
            context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0)
        }

        function setVisualizationMode(mode) {
            if (!['spots', 'lines', 'rain'].includes(mode)) return

            visualizationMode = mode
            particles = []
            strokes = []
            rainDrops = []
            context.clearRect(0, 0, width, height)

            for (const button of modeButtons) {
                button.setAttribute('aria-pressed', String(button.dataset.mode === mode))
            }

            const labels = {
                spots: 'Плями',
                lines: 'Лінії',
                rain: 'Кольоровий дощ'
            }

            visualLabel.textContent = `Live visual · ${labels[mode]}`
        }

        function updateDeviceList() {
            const previousValue = deviceSelect.value
            const inputs = Array.from(midiAccess?.inputs.values() || [])
            deviceSelect.innerHTML = ''

            if (!inputs.length) {
                const option = document.createElement('option')
                option.value = ''
                option.textContent = 'Немає доступних пристроїв'
                deviceSelect.appendChild(option)
                deviceSelect.disabled = true
                selectedInput = null
                setStatus(false, 'MIDI-пристрій не знайдено')
                return
            }

            for (const input of inputs) {
                const option = document.createElement('option')
                option.value = input.id
                option.textContent = input.name || input.manufacturer || 'MIDI input'
                deviceSelect.appendChild(option)
            }

            deviceSelect.disabled = false
            const nextValue = inputs.some(input => input.id === previousValue) ? previousValue : inputs[0].id
            deviceSelect.value = nextValue
            selectInput(nextValue)
        }

        function selectInput(id) {
            if (selectedInput) selectedInput.onmidimessage = null
            selectedInput = midiAccess?.inputs.get(id) || null

            if (!selectedInput) {
                setStatus(false, 'MIDI-пристрій не вибрано')
                return
            }

            selectedInput.onmidimessage = handleMIDIMessage
            setStatus(true, selectedInput.name || 'MIDI підключено')
            message.textContent = 'Зіграйте ноту на піаніно. MIDI-події з’являться тут у реальному часі.'
        }

        function spawnSpot(note, velocity) {
            const normalizedNote = Math.max(0, Math.min(1, (note - 21) / 87))
            const strength = Math.max(.05, velocity / 127)
            const hue = (note * 19) % 360

            particles.push({
                x: width * (.1 + normalizedNote * .8),
                y: height * (.5 + (Math.random() - .5) * .18),
                radius: 12 + strength * 72,
                alpha: .35 + strength * .65,
                hue,
                vx: (Math.random() - .5) * (1 + strength * 2.5),
                vy: -(.3 + Math.random() * 1.8 + strength),
                life: 1,
                decay: .006 + Math.random() * .008
            })

            if (particles.length > 220) particles = particles.slice(-220)
        }

        function spawnStroke(note, velocity) {
            const normalizedNote = Math.max(0, Math.min(1, (note - 21) / 87))
            const strength = Math.max(.05, velocity / 127)
            const hue = (note * 19) % 360
            const x = width * (.08 + normalizedNote * .84)
            const y = height * (.18 + (1 - normalizedNote) * .64)
            const length = 90 + strength * Math.min(width * .32, 330)
            const angle = ((note % 12) / 12 - .5) * .9 + (Math.random() - .5) * .35

            strokes.push({
                x,
                y,
                length,
                angle,
                hue,
                alpha: .4 + strength * .6,
                lineWidth: 1.5 + strength * 10,
                speed: .35 + strength * 1.7,
                wave: 8 + strength * 28,
                phase: Math.random() * Math.PI * 2,
                life: 1,
                decay: .005 + Math.random() * .006
            })

            if (strokes.length > 140) strokes = strokes.slice(-140)
        }

        function spawnRain(note, velocity) {
            const normalizedNote = Math.max(0, Math.min(1, (note - 21) / 87))
            const strength = Math.max(.05, velocity / 127)
            const hue = (note * 19) % 360
            const dropCount = 2 + Math.round(strength * 4)

            for (let i = 0; i < dropCount; i += 1) {
                const offset = (Math.random() - .5) * (28 + strength * 42)

                rainDrops.push({
                    x: width * (.08 + normalizedNote * .84) + offset,
                    y: -20 - Math.random() * height * .12,
                    vy: .35 + strength * .55 + Math.random() * .2,
                    targetVy: 2.4 + strength * 4.5 + Math.random() * 1.2,
                    acceleration: .012 + Math.random() * .01,
                    drift: (Math.random() - .5) * .18,
                    length: 24 + strength * 80 + Math.random() * 34,
                    lineWidth: .8 + strength * 3.8,
                    hue: (hue + (Math.random() - .5) * 18 + 360) % 360,
                    alpha: .34 + strength * .5,
                    life: 1,
                    phase: Math.random() * Math.PI * 2,
                    sway: 3 + Math.random() * 9
                })
            }

            if (rainDrops.length > 320) rainDrops = rainDrops.slice(-320)
        }

        function createVisual(note, velocity) {
            if (visualizationMode === 'lines') {
                spawnStroke(note, velocity)
                return
            }

            if (visualizationMode === 'rain') {
                spawnRain(note, velocity)
                return
            }

            spawnSpot(note, velocity)
        }

        function handleMIDIMessage(event) {
            const [statusByte, data1, data2] = event.data
            const command = statusByte & 0xf0
            const channel = (statusByte & 0x0f) + 1

            if (command === 0x90 && data2 > 0) {
                eventValue.textContent = 'Note On'
                noteValue.textContent = noteName(data1)
                midiValue.textContent = data1
                velocityValue.textContent = data2
                createVisual(data1, data2)
                message.textContent = `Channel ${channel}`
                return
            }

            if (command === 0x80 || (command === 0x90 && data2 === 0)) {
                eventValue.textContent = 'Note Off'
                noteValue.textContent = noteName(data1)
                midiValue.textContent = data1
                velocityValue.textContent = data2
                message.textContent = `Channel ${channel}`
                return
            }

            if (command === 0xb0) {
                eventValue.textContent = data1 === 64 ? 'Pedal' : 'Control'
                noteValue.textContent = data1 === 64 ? (data2 >= 64 ? 'Down' : 'Up') : `CC ${data1}`
                midiValue.textContent = data1
                velocityValue.textContent = data2
                message.textContent = `Channel ${channel}`
            }
        }

        async function connectMIDI() {
            if (!('requestMIDIAccess' in navigator)) {
                setStatus(false, 'Web MIDI не підтримується')
                message.textContent = 'Цей браузер не підтримує Web MIDI API. Використай актуальний Chrome або Edge.'
                connectButton.disabled = true
                return
            }

            connectButton.disabled = true
            connectButton.textContent = 'Підключення…'

            try {
                midiAccess = await navigator.requestMIDIAccess({ sysex: false })
                midiAccess.addEventListener('statechange', updateDeviceList)
                updateDeviceList()
                connectButton.textContent = 'MIDI підключено'
            } catch (error) {
                setStatus(false, 'Доступ до MIDI не надано')
                message.textContent = error?.message || 'Не вдалося отримати доступ до MIDI-пристрою.'
                connectButton.disabled = false
                connectButton.textContent = 'Підключити MIDI'
            }
        }

        async function toggleFullscreen() {
            try {
                if (!document.fullscreenElement) {
                    if (visual.requestFullscreen) await visual.requestFullscreen()
                    else if (visual.webkitRequestFullscreen) visual.webkitRequestFullscreen()
                    return
                }

                if (document.exitFullscreen) await document.exitFullscreen()
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen()
            } catch (error) {
                message.textContent = 'Не вдалося відкрити fullscreen у цьому браузері.'
            }
        }

        function updateFullscreenState() {
            const isFullscreen = document.fullscreenElement === visual || document.webkitFullscreenElement === visual
            fullscreenButton.setAttribute('aria-label', isFullscreen ? 'Вийти з повноекранного режиму' : 'Відкрити візуалізацію на весь екран')
            fullscreenButton.title = isFullscreen ? 'Вийти з повноекранного режиму' : 'На весь екран'
            fullscreenIcon.innerHTML = isFullscreen
                ? '<path d="M9 3v6H3"></path><path d="M15 3v6h6"></path><path d="M9 21v-6H3"></path><path d="M15 21v-6h6"></path>'
                : '<path d="M8 3H3v5"></path><path d="M16 3h5v5"></path><path d="M8 21H3v-5"></path><path d="M16 21h5v-5"></path>'
            requestAnimationFrame(resizeCanvas)
        }

        function drawSpots() {
            context.globalCompositeOperation = 'lighter'

            for (const particle of particles) {
                particle.x += particle.vx
                particle.y += particle.vy
                particle.life -= particle.decay
                particle.radius *= 1.004

                const alpha = Math.max(0, particle.alpha * particle.life)
                const gradient = context.createRadialGradient(particle.x, particle.y, 0, particle.x, particle.y, particle.radius)
                gradient.addColorStop(0, `hsla(${particle.hue}, 88%, 70%, ${alpha})`)
                gradient.addColorStop(.35, `hsla(${particle.hue}, 82%, 56%, ${alpha * .55})`)
                gradient.addColorStop(1, `hsla(${particle.hue}, 76%, 38%, 0)`)

                context.fillStyle = gradient
                context.beginPath()
                context.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2)
                context.fill()
            }

            particles = particles.filter(particle => particle.life > 0)
        }

        function drawLines() {
            context.globalCompositeOperation = 'lighter'
            context.lineCap = 'round'
            context.lineJoin = 'round'

            for (const stroke of strokes) {
                stroke.life -= stroke.decay
                stroke.phase += .018 + stroke.speed * .006
                stroke.x += Math.cos(stroke.angle) * stroke.speed
                stroke.y += Math.sin(stroke.angle) * stroke.speed

                const alpha = Math.max(0, stroke.alpha * stroke.life)
                const dx = Math.cos(stroke.angle) * stroke.length
                const dy = Math.sin(stroke.angle) * stroke.length
                const px = -Math.sin(stroke.angle)
                const py = Math.cos(stroke.angle)
                const x1 = stroke.x - dx * .5
                const y1 = stroke.y - dy * .5
                const x2 = stroke.x + dx * .5
                const y2 = stroke.y + dy * .5
                const bend = Math.sin(stroke.phase) * stroke.wave
                const cx = stroke.x + px * bend
                const cy = stroke.y + py * bend

                context.shadowBlur = 12 + stroke.lineWidth * 2
                context.shadowColor = `hsla(${stroke.hue}, 90%, 65%, ${alpha * .75})`
                context.strokeStyle = `hsla(${stroke.hue}, 90%, 68%, ${alpha})`
                context.lineWidth = stroke.lineWidth
                context.beginPath()
                context.moveTo(x1, y1)
                context.quadraticCurveTo(cx, cy, x2, y2)
                context.stroke()

                context.shadowBlur = 0
                context.strokeStyle = `hsla(${stroke.hue}, 95%, 88%, ${alpha * .7})`
                context.lineWidth = Math.max(1, stroke.lineWidth * .18)
                context.beginPath()
                context.moveTo(x1, y1)
                context.quadraticCurveTo(cx, cy, x2, y2)
                context.stroke()
            }

            strokes = strokes.filter(stroke => stroke.life > 0)
            context.shadowBlur = 0
        }

        function drawRain() {
            context.globalCompositeOperation = 'lighter'
            context.lineCap = 'round'

            for (const drop of rainDrops) {
                drop.vy += (drop.targetVy - drop.vy) * drop.acceleration
                drop.phase += .012
                drop.x += drop.drift + Math.sin(drop.phase) * .025
                drop.y += drop.vy

                if (drop.y > height * .72) {
                    drop.life -= .006
                }

                if (drop.y > height + drop.length) {
                    drop.life = 0
                }

                const alpha = Math.max(0, drop.alpha * drop.life)
                const sway = Math.sin(drop.phase) * drop.sway
                const tailX = drop.x - drop.drift * drop.length * .7 - sway
                const tailY = drop.y - drop.length
                const gradient = context.createLinearGradient(tailX, tailY, drop.x, drop.y)
                gradient.addColorStop(0, `hsla(${drop.hue}, 92%, 58%, 0)`)
                gradient.addColorStop(.55, `hsla(${drop.hue}, 92%, 62%, ${alpha * .45})`)
                gradient.addColorStop(1, `hsla(${drop.hue}, 98%, 78%, ${alpha})`)

                context.shadowBlur = 10 + drop.lineWidth * 4
                context.shadowColor = `hsla(${drop.hue}, 95%, 65%, ${alpha * .65})`
                context.strokeStyle = gradient
                context.lineWidth = drop.lineWidth
                context.beginPath()
                context.moveTo(tailX, tailY)
                context.quadraticCurveTo(
                    drop.x - sway * .45,
                    drop.y - drop.length * .46,
                    drop.x,
                    drop.y
                )
                context.stroke()

                context.shadowBlur = 12 + drop.lineWidth * 3
                context.fillStyle = `hsla(${drop.hue}, 100%, 86%, ${alpha * .9})`
                context.beginPath()
                context.arc(drop.x, drop.y, Math.max(1.2, drop.lineWidth * .8), 0, Math.PI * 2)
                context.fill()
            }

            rainDrops = rainDrops.filter(drop => drop.life > 0)
            context.shadowBlur = 0
        }

        function animate() {
            context.globalCompositeOperation = 'source-over'

            const fade = visualizationMode === 'lines'
                ? .075
                : visualizationMode === 'rain'
                    ? .055
                    : .12

            context.fillStyle = `rgba(5, 5, 5, ${fade})`
            context.fillRect(0, 0, width, height)

            if (visualizationMode === 'lines') drawLines()
            else if (visualizationMode === 'rain') drawRain()
            else drawSpots()

            context.globalCompositeOperation = 'source-over'
            requestAnimationFrame(animate)
        }

        connectButton.addEventListener('click', connectMIDI)
        deviceSelect.addEventListener('change', event => selectInput(event.target.value))
        fullscreenButton.addEventListener('click', toggleFullscreen)
        modeButtons.forEach(button => button.addEventListener('click', () => setVisualizationMode(button.dataset.mode)))
        visual.addEventListener('dblclick', event => {
            if (!event.target.closest('.fullscreen-button')) toggleFullscreen()
        })
        document.addEventListener('fullscreenchange', updateFullscreenState)
        document.addEventListener('webkitfullscreenchange', updateFullscreenState)
        window.addEventListener('resize', resizeCanvas)

        resizeCanvas()
        animate()
    </script>
</body>
</html>
