<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>MIDI Canvas</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f5f5f5;background:#090909}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090909}button,select{font:inherit}.app{display:grid;grid-template-columns:minmax(280px,360px) 1fr;min-height:100vh}.panel{display:flex;flex-direction:column;gap:20px;padding:28px;border-right:1px solid #252525;background:#111}.eyebrow{margin:0 0 6px;color:#929292;font-size:12px;letter-spacing:.14em;text-transform:uppercase}h1{margin:0;font-size:clamp(28px,4vw,42px);line-height:1}.description{margin:0;color:#aaa;line-height:1.55}.status{display:flex;align-items:center;gap:10px;color:#b7b7b7}.status-dot{width:10px;height:10px;border-radius:50%;background:#555}.status[data-state=connected] .status-dot{background:#52d273;box-shadow:0 0 16px rgba(82,210,115,.4)}.button{min-height:48px;border:0;border-radius:12px;padding:0 18px;color:#111;background:#f5f5f5;cursor:pointer;font-weight:700}.button:disabled{opacity:.45;cursor:not-allowed}.field{display:grid;gap:8px}.field label,.field-title{color:#929292;font-size:13px}select{width:100%;min-height:44px;border:1px solid #343434;border-radius:10px;padding:0 12px;color:#f5f5f5;background:#191919}.mode-switch{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:5px;border:1px solid #2b2b2b;border-radius:12px;background:#171717}.mode-button{min-height:40px;border:0;border-radius:8px;padding:0 8px;color:#999;background:transparent;cursor:pointer;font-weight:650}.mode-button[aria-pressed=true]{color:#111;background:#f5f5f5}.palette-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.palette-button{position:relative;min-width:0;height:38px;border:1px solid #343434;border-radius:9px;padding:4px;background:#171717;cursor:pointer}.palette-button:before{content:"";display:block;width:100%;height:100%;border-radius:5px;background:var(--palette-preview)}.palette-button[aria-pressed=true]{border-color:#f5f5f5;box-shadow:0 0 0 1px #f5f5f5 inset}.palette-name{color:#777;font-size:11px;line-height:1.2;text-align:center}.monitor{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{min-width:0;padding:14px;border:1px solid #292929;border-radius:12px;background:#171717}.metric span{display:block;margin-bottom:6px;color:#777;font-size:11px;letter-spacing:.08em;text-transform:uppercase}.metric strong{display:block;overflow:hidden;color:#fff;font-size:20px;text-overflow:ellipsis;white-space:nowrap}.message{min-height:44px;margin-top:auto;color:#858585;font-size:13px;line-height:1.45}.visual{position:relative;min-width:0;min-height:100vh;overflow:hidden;background:#050505}.visual:fullscreen,.visual:-webkit-full-screen{width:100vw;height:100vh;min-height:100vh;background:#050505}canvas{display:block;width:100%;height:100%}.visual-label{position:absolute;top:20px;right:78px;pointer-events:none;color:rgba(255,255,255,.3);font-size:12px;letter-spacing:.12em;text-transform:uppercase}.fullscreen-button{position:absolute;top:14px;right:16px;z-index:3;display:grid;width:44px;height:44px;place-items:center;border:1px solid rgba(255,255,255,.14);border-radius:12px;color:rgba(255,255,255,.82);background:rgba(18,18,18,.68);backdrop-filter:blur(12px);cursor:pointer}.fullscreen-button:hover{background:rgba(34,34,34,.86)}.fullscreen-button svg{width:20px;height:20px}.visual:fullscreen .visual-label,.visual:-webkit-full-screen .visual-label{opacity:0}.visual:fullscreen .fullscreen-button,.visual:-webkit-full-screen .fullscreen-button{opacity:.32}.visual:fullscreen .fullscreen-button:hover,.visual:-webkit-full-screen .fullscreen-button:hover{opacity:1}@media(max-width:820px){.app{grid-template-columns:1fr}.panel{border-right:0;border-bottom:1px solid #252525}.visual{min-height:58vh}}
</style>
</head>
<body>
<main class="app">
<section class="panel">
<div><p class="eyebrow">Web MIDI experiment</p><h1>MIDI Canvas</h1></div>
<p class="description">Підключи цифрове піаніно через USB, дозволь браузеру доступ до MIDI та зіграй кілька нот.</p>
<div class="status" id="status" data-state="disconnected"><span class="status-dot"></span><span id="statusText">MIDI не підключено</span></div>
<button class="button" id="connectButton" type="button">Підключити MIDI</button>
<div class="field"><label for="deviceSelect">MIDI input</label><select id="deviceSelect" disabled><option value="">Немає доступних пристроїв</option></select></div>
<div class="field"><div class="field-title">Візуалізація</div><div class="mode-switch" aria-label="Режим візуалізації"><button class="mode-button" type="button" data-mode="spots" aria-pressed="true">Плями</button><button class="mode-button" type="button" data-mode="lines" aria-pressed="false">Лінії</button><button class="mode-button" type="button" data-mode="rain" aria-pressed="false">Дощ</button><button class="mode-button" type="button" data-mode="aurora" aria-pressed="false">Сяйво</button><button class="mode-button" type="button" data-mode="equalizer" aria-pressed="false">Еквалайзер</button><button class="mode-button" type="button" data-mode="fireflies" aria-pressed="false">Світлячки</button></div></div>
<div class="field"><div class="field-title">Палітра</div><div class="palette-grid" aria-label="Палітра кольорів"><button class="palette-button" type="button" data-palette="warm" aria-pressed="true" aria-label="Тепла палітра" title="Тепла" style="--palette-preview:linear-gradient(135deg,#ff4d2e,#ff9b35,#ffd35a)"></button><button class="palette-button" type="button" data-palette="cool" aria-pressed="false" aria-label="Холодна палітра" title="Холодна" style="--palette-preview:linear-gradient(135deg,#22d3ee,#3b82f6,#8b5cf6)"></button><button class="palette-button" type="button" data-palette="pastel" aria-pressed="false" aria-label="Пастельна палітра" title="Пастельна" style="--palette-preview:linear-gradient(135deg,#ffc9de,#bfe5ff,#d7c7ff)"></button><button class="palette-button" type="button" data-palette="neon" aria-pressed="false" aria-label="Неонова палітра" title="Неонова" style="--palette-preview:linear-gradient(135deg,#00ff9d,#00d9ff,#ff00d4)"></button><button class="palette-button" type="button" data-palette="contrast" aria-pressed="false" aria-label="Контрастна палітра" title="Контрастна" style="--palette-preview:linear-gradient(135deg,#ff2d55 0 25%,#00e5ff 25% 50%,#ffe600 50% 75%,#8b5cf6 75%)"></button></div><div class="palette-name" id="paletteName">Тепла</div></div>
<div class="monitor"><div class="metric"><span>Event</span><strong id="eventValue">—</strong></div><div class="metric"><span>Note</span><strong id="noteValue">—</strong></div><div class="metric"><span>MIDI</span><strong id="midiValue">—</strong></div><div class="metric"><span>Velocity</span><strong id="velocityValue">—</strong></div></div>
<div class="message" id="message">Для Web MIDI відкрий сторінку в Chrome або Edge через HTTPS або localhost.</div>
</section>
<section class="visual" id="visual"><canvas id="canvas"></canvas><div class="visual-label" id="visualLabel">Live visual · Плями</div><button class="fullscreen-button" id="fullscreenButton" type="button" aria-label="Відкрити візуалізацію на весь екран" title="На весь екран"><svg id="fullscreenIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5"></path><path d="M16 3h5v5"></path><path d="M8 21H3v-5"></path><path d="M16 21h5v-5"></path></svg></button></section>
</main>
<script>
const connectButton=document.getElementById('connectButton'),deviceSelect=document.getElementById('deviceSelect'),status=document.getElementById('status'),statusText=document.getElementById('statusText'),eventValue=document.getElementById('eventValue'),noteValue=document.getElementById('noteValue'),midiValue=document.getElementById('midiValue'),velocityValue=document.getElementById('velocityValue'),message=document.getElementById('message'),visual=document.getElementById('visual'),visualLabel=document.getElementById('visualLabel'),canvas=document.getElementById('canvas'),fullscreenButton=document.getElementById('fullscreenButton'),fullscreenIcon=document.getElementById('fullscreenIcon'),modeButtons=[...document.querySelectorAll('.mode-button')],paletteButtons=[...document.querySelectorAll('.palette-button')],paletteName=document.getElementById('paletteName'),context=canvas.getContext('2d',{alpha:false})
let midiAccess=null,selectedInput=null,visualizationMode='spots',colorPalette='warm',particles=[],strokes=[],rainDrops=[],auroraBands=[],eqBars=[],fireflies=[],width=0,height=0,pixelRatio=1,lastFrameTime=0
const noteNames=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B']
const palettes={warm:{label:'Тепла',hues:[4,18,32,44,54,350],saturation:90,lightness:62},cool:{label:'Холодна',hues:[178,192,208,224,244,268],saturation:88,lightness:64},pastel:{label:'Пастельна',hues:[342,18,52,154,198,262],saturation:58,lightness:78},neon:{label:'Неонова',hues:[155,182,202,282,318,56],saturation:100,lightness:62},contrast:{label:'Контрастна',hues:[350,188,54,268,118,24],saturation:96,lightness:60}}
function noteName(n){return`${noteNames[n%12]}${Math.floor(n/12)-1}`}
function paletteColor(note,offset=0){const p=palettes[colorPalette],i=Math.abs(note+offset)%p.hues.length;return{hue:p.hues[i],saturation:p.saturation,lightness:p.lightness}}
function hsl(c,shift=0,a=1){return`hsla(${c.hue},${c.saturation}%,${Math.max(0,Math.min(100,c.lightness+shift))}%,${a})`}
function setStatus(ok,text){status.dataset.state=ok?'connected':'disconnected';statusText.textContent=text}
function initEqualizer(){eqBars=Array.from({length:16},(_,i)=>({level:0,target:0,peak:0,peakHold:0,color:paletteColor(21+i*5)}))}
function initFireflies(){const count=Math.max(28,Math.min(36,Math.round(width/35)));fireflies=Array.from({length:count},(_,i)=>({x:Math.random()*width,y:height*(.12+Math.random()*.78),vx:(Math.random()-.5)*.18,vy:(Math.random()-.5)*.12,targetVx:(Math.random()-.5)*.22,targetVy:(Math.random()-.5)*.16,size:1.5+Math.random()*2.8,phase:Math.random()*Math.PI*2,pulse:.006+Math.random()*.012,base:.08+Math.random()*.18,flash:0,color:paletteColor(45+i)}))}
function resizeCanvas(){const r=visual.getBoundingClientRect(),max=['rain','aurora','fireflies'].includes(visualizationMode)?1.35:2;pixelRatio=Math.min(devicePixelRatio||1,max);width=Math.max(1,Math.round(r.width));height=Math.max(1,Math.round(r.height));canvas.width=Math.round(width*pixelRatio);canvas.height=Math.round(height*pixelRatio);context.setTransform(pixelRatio,0,0,pixelRatio,0,0);context.fillStyle='#050505';context.fillRect(0,0,width,height);if(visualizationMode==='fireflies')initFireflies()}
function clearVisuals(){particles=[];strokes=[];rainDrops=[];auroraBands=[];initEqualizer();fireflies=[];resizeCanvas()}
function setVisualizationMode(mode){if(!['spots','lines','rain','aurora','equalizer','fireflies'].includes(mode))return;visualizationMode=mode;clearVisuals();modeButtons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));visualLabel.textContent=`Live visual · ${{spots:'Плями',lines:'Лінії',rain:'Кольоровий дощ',aurora:'Полярне сяйво',equalizer:'MIDI еквалайзер',fireflies:'Нічні світлячки'}[mode]}`}
function setColorPalette(p){if(!palettes[p])return;colorPalette=p;paletteButtons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.palette===p)));paletteName.textContent=palettes[p].label;clearVisuals()}
function updateDeviceList(){const prev=deviceSelect.value,inputs=[...(midiAccess?.inputs.values()||[])];deviceSelect.innerHTML='';if(!inputs.length){deviceSelect.innerHTML='<option value="">Немає доступних пристроїв</option>';deviceSelect.disabled=true;selectedInput=null;setStatus(false,'MIDI-пристрій не знайдено');return}inputs.forEach(input=>{const o=document.createElement('option');o.value=input.id;o.textContent=input.name||input.manufacturer||'MIDI input';deviceSelect.appendChild(o)});deviceSelect.disabled=false;deviceSelect.value=inputs.some(i=>i.id===prev)?prev:inputs[0].id;selectInput(deviceSelect.value)}
function selectInput(id){if(selectedInput)selectedInput.onmidimessage=null;selectedInput=midiAccess?.inputs.get(id)||null;if(!selectedInput){setStatus(false,'MIDI-пристрій не вибрано');return}selectedInput.onmidimessage=handleMIDIMessage;setStatus(true,selectedInput.name||'MIDI підключено');message.textContent='Зіграйте ноту на піаніно. MIDI-події з’являться тут у реальному часі.'}
function spawnSpot(note,velocity){const n=Math.max(0,Math.min(1,(note-21)/87)),s=Math.max(.05,velocity/127),color=paletteColor(note);particles.push({x:width*(.1+n*.8),y:height*(.5+(Math.random()-.5)*.18),radius:12+s*72,alpha:.35+s*.65,color,vx:(Math.random()-.5)*(1+s*2.5),vy:-(.3+Math.random()*1.8+s),life:1,decay:.006+Math.random()*.008});if(particles.length>220)particles=particles.slice(-220)}
function spawnStroke(note,velocity){const n=Math.max(0,Math.min(1,(note-21)/87)),s=Math.max(.05,velocity/127),color=paletteColor(note),x=width*(.08+n*.84),y=height*(.18+(1-n)*.64),length=90+s*Math.min(width*.32,330),angle=((note%12)/12-.5)*.9+(Math.random()-.5)*.35;strokes.push({x,y,length,angle,color,alpha:.4+s*.6,lineWidth:1.5+s*10,speed:.35+s*1.7,wave:8+s*28,phase:Math.random()*Math.PI*2,life:1,decay:.005+Math.random()*.006});if(strokes.length>140)strokes=strokes.slice(-140)}
function spawnRain(note,velocity){const n=Math.max(0,Math.min(1,(note-21)/87)),s=Math.max(.05,velocity/127),count=1+Math.round(s*2),baseX=width*(.08+n*.84);for(let i=0;i<count;i++){rainDrops.push({x:baseX+(Math.random()-.5)*(24+s*36),y:-30-Math.random()*Math.min(height*.1,80),vy:.55+s*.8+Math.random()*.25,targetVy:3+s*4.4+Math.random()*.7,acceleration:.025+Math.random()*.012,drift:(Math.random()-.5)*.12,length:30+s*68+Math.random()*24,lineWidth:1+s*2.8,color:paletteColor(note,i),alpha:.42+s*.5,life:1,phase:Math.random()*Math.PI*2,sway:2+Math.random()*5})}if(rainDrops.length>150)rainDrops.splice(0,rainDrops.length-150)}
function auroraColor(note,offset=0){if(colorPalette==='warm'||colorPalette==='contrast'||colorPalette==='pastel')return paletteColor(note,offset);const base=[118,132,154,174,188,276,305],hue=base[Math.abs(note+offset)%base.length];return{hue,saturation:colorPalette==='neon'?100:88,lightness:colorPalette==='neon'?62:58}}
function spawnAurora(note,velocity){const n=Math.max(0,Math.min(1,(note-21)/87)),s=Math.max(.05,velocity/127),targetY=height*(.14+(1-n)*.42),color=auroraColor(note),slot=Math.round(note/4),existing=auroraBands.find(b=>b.slot===slot);if(existing){existing.note=note;existing.targetY=targetY;existing.targetColor={...color};existing.targetEnergy=Math.min(1.35,existing.targetEnergy+.3+s*.9);existing.curtain=90+s*220;existing.waveA=18+s*44;existing.waveB=6+s*18;return}auroraBands.push({slot,note,y:targetY,targetY,color:{...color},targetColor:{...color},energy:.08,targetEnergy:.45+s*.7,phase:Math.random()*Math.PI*2,speed:.0025+Math.random()*.0025,waveA:18+s*44,waveB:6+s*18,frequency:.7+Math.random()*.65,curtain:90+s*220,drift:(Math.random()-.5)*.12});if(auroraBands.length>5){auroraBands.sort((a,b)=>b.energy-a.energy);auroraBands.length=5}}
function hitEqualizer(note,velocity){const n=Math.max(0,Math.min(1,(note-21)/87)),index=Math.max(0,Math.min(eqBars.length-1,Math.round(n*(eqBars.length-1)))),strength=Math.max(.08,velocity/127);for(let d=-2;d<=2;d++){const i=index+d;if(i<0||i>=eqBars.length)continue;const influence=Math.max(.15,1-Math.abs(d)*.32),value=strength*influence;eqBars[i].target=Math.max(eqBars[i].target,value);eqBars[i].peak=Math.max(eqBars[i].peak,value);eqBars[i].peakHold=26;eqBars[i].color=paletteColor(note,d)}}
function exciteFireflies(note,velocity){if(!fireflies.length)initFireflies();const n=Math.max(0,Math.min(1,(note-21)/87)),strength=Math.max(.08,velocity/127),targetX=width*(.08+n*.84);const sorted=[...fireflies].sort((a,b)=>Math.abs(a.x-targetX)-Math.abs(b.x-targetX));const count=3+Math.round(strength*5);for(let i=0;i<Math.min(count,sorted.length);i++){const f=sorted[i];f.flash=Math.min(1.5,f.flash+.35+strength*.85);f.color=paletteColor(note,i);f.targetVx+=(Math.random()-.5)*(.08+strength*.15);f.targetVy+=(Math.random()-.5)*(.06+strength*.12)}}
function createVisual(note,velocity){if(visualizationMode==='lines')return spawnStroke(note,velocity);if(visualizationMode==='rain')return spawnRain(note,velocity);if(visualizationMode==='aurora')return spawnAurora(note,velocity);if(visualizationMode==='equalizer')return hitEqualizer(note,velocity);if(visualizationMode==='fireflies')return exciteFireflies(note,velocity);spawnSpot(note,velocity)}
function handleMIDIMessage(e){const[s,d1,d2]=e.data,cmd=s&240,ch=(s&15)+1;if(cmd===144&&d2>0){eventValue.textContent='Note On';noteValue.textContent=noteName(d1);midiValue.textContent=d1;velocityValue.textContent=d2;createVisual(d1,d2);message.textContent=`Channel ${ch}`;return}if(cmd===128||(cmd===144&&d2===0)){eventValue.textContent='Note Off';noteValue.textContent=noteName(d1);midiValue.textContent=d1;velocityValue.textContent=d2;message.textContent=`Channel ${ch}`;return}if(cmd===176){eventValue.textContent=d1===64?'Pedal':'Control';noteValue.textContent=d1===64?(d2>=64?'Down':'Up'):`CC ${d1}`;midiValue.textContent=d1;velocityValue.textContent=d2;message.textContent=`Channel ${ch}`}}
async function connectMIDI(){if(!('requestMIDIAccess'in navigator)){setStatus(false,'Web MIDI не підтримується');message.textContent='Цей браузер не підтримує Web MIDI API. Використай актуальний Chrome або Edge.';connectButton.disabled=true;return}connectButton.disabled=true;connectButton.textContent='Підключення…';try{midiAccess=await navigator.requestMIDIAccess({sysex:false});midiAccess.addEventListener('statechange',updateDeviceList);updateDeviceList();connectButton.textContent='MIDI підключено'}catch(e){setStatus(false,'Доступ до MIDI не надано');message.textContent=e?.message||'Не вдалося отримати доступ до MIDI-пристрою.';connectButton.disabled=false;connectButton.textContent='Підключити MIDI'}}
async function toggleFullscreen(){try{if(!document.fullscreenElement){if(visual.requestFullscreen)await visual.requestFullscreen();else if(visual.webkitRequestFullscreen)visual.webkitRequestFullscreen();return}if(document.exitFullscreen)await document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen()}catch{message.textContent='Не вдалося відкрити fullscreen у цьому браузері.'}}
function updateFullscreenState(){const f=document.fullscreenElement===visual||document.webkitFullscreenElement===visual;fullscreenButton.setAttribute('aria-label',f?'Вийти з повноекранного режиму':'Відкрити візуалізацію на весь екран');fullscreenButton.title=f?'Вийти з повноекранного режиму':'На весь екран';fullscreenIcon.innerHTML=f?'<path d="M9 3v6H3"></path><path d="M15 3v6h6"></path><path d="M9 21v-6H3"></path><path d="M15 21v-6h6"></path>':'<path d="M8 3H3v5"></path><path d="M16 3h5v5"></path><path d="M8 21H3v-5"></path><path d="M16 21h5v-5"></path>';requestAnimationFrame(resizeCanvas)}
function drawSpots(step){context.globalCompositeOperation='lighter';for(const p of particles){p.x+=p.vx*step;p.y+=p.vy*step;p.life-=p.decay*step;p.radius*=Math.pow(1.004,step);const a=Math.max(0,p.alpha*p.life),g=context.createRadialGradient(p.x,p.y,0,p.x,p.y,p.radius);g.addColorStop(0,hsl(p.color,10,a));g.addColorStop(.35,hsl(p.color,0,a*.55));g.addColorStop(1,hsl(p.color,-16,0));context.fillStyle=g;context.beginPath();context.arc(p.x,p.y,p.radius,0,Math.PI*2);context.fill()}particles=particles.filter(p=>p.life>0)}
function drawLines(step){context.globalCompositeOperation='lighter';context.lineCap='round';context.lineJoin='round';for(const s of strokes){s.life-=s.decay*step;s.phase+=(.018+s.speed*.006)*step;s.x+=Math.cos(s.angle)*s.speed*step;s.y+=Math.sin(s.angle)*s.speed*step;const a=Math.max(0,s.alpha*s.life),dx=Math.cos(s.angle)*s.length,dy=Math.sin(s.angle)*s.length,px=-Math.sin(s.angle),py=Math.cos(s.angle),x1=s.x-dx*.5,y1=s.y-dy*.5,x2=s.x+dx*.5,y2=s.y+dy*.5,b=Math.sin(s.phase)*s.wave,cx=s.x+px*b,cy=s.y+py*b;context.shadowBlur=12+s.lineWidth*2;context.shadowColor=hsl(s.color,3,a*.75);context.strokeStyle=hsl(s.color,6,a);context.lineWidth=s.lineWidth;context.beginPath();context.moveTo(x1,y1);context.quadraticCurveTo(cx,cy,x2,y2);context.stroke();context.shadowBlur=0;context.strokeStyle=hsl(s.color,24,a*.7);context.lineWidth=Math.max(1,s.lineWidth*.18);context.beginPath();context.moveTo(x1,y1);context.quadraticCurveTo(cx,cy,x2,y2);context.stroke()}strokes=strokes.filter(s=>s.life>0);context.shadowBlur=0}
function drawRain(step){context.globalCompositeOperation='lighter';context.lineCap='round';for(let i=rainDrops.length-1;i>=0;i--){const d=rainDrops[i];d.vy+=(d.targetVy-d.vy)*d.acceleration*step;d.phase+=.011*step;d.x+=(d.drift+Math.sin(d.phase)*.018)*step;d.y+=d.vy*step;if(d.y>height*.76)d.life-=.012*step;if(d.y>height+d.length||d.life<=0){rainDrops.splice(i,1);continue}const a=Math.max(0,d.alpha*d.life),sway=Math.sin(d.phase)*d.sway,tx=d.x-sway,ty=d.y-d.length;context.strokeStyle=hsl(d.color,-4,a*.25);context.lineWidth=d.lineWidth*3;context.beginPath();context.moveTo(tx,ty);context.lineTo(d.x,d.y);context.stroke();context.strokeStyle=hsl(d.color,12,a);context.lineWidth=d.lineWidth;context.beginPath();context.moveTo(tx,ty+d.length*.18);context.lineTo(d.x,d.y);context.stroke();context.fillStyle=hsl(d.color,28,a);context.fillRect(d.x-Math.max(.7,d.lineWidth*.3),d.y-Math.max(.7,d.lineWidth*.3),Math.max(1.4,d.lineWidth*.6),Math.max(1.4,d.lineWidth*.6))}}
function drawAurora(step){context.globalCompositeOperation='lighter';context.lineCap='round';context.shadowBlur=0;for(let i=auroraBands.length-1;i>=0;i--){const b=auroraBands[i];b.energy+=(b.targetEnergy-b.energy)*.065*step;b.targetEnergy*=Math.pow(.991,step);b.y+=(b.targetY-b.y)*.028*step;b.color.hue+=(b.targetColor.hue-b.color.hue)*.035*step;b.color.saturation+=(b.targetColor.saturation-b.color.saturation)*.035*step;b.color.lightness+=(b.targetColor.lightness-b.color.lightness)*.035*step;b.phase+=b.speed*60*step;if(b.energy<.008&&b.targetEnergy<.008){auroraBands.splice(i,1);continue}const rays=54,energy=Math.min(1.2,b.energy);for(let r=0;r<rays;r++){const nx=r/(rays-1),x=nx*width,edge=Math.sin(nx*Math.PI),wave=Math.sin(nx*Math.PI*2*b.frequency+b.phase)*b.waveA+Math.sin(nx*Math.PI*5.1+b.phase*.47)*b.waveB+Math.sin(nx*Math.PI*9.3-b.phase*.28)*5,top=b.y+wave,flutter=.72+.28*Math.sin(r*.83+b.phase*2.1),length=b.curtain*edge*(.35+.65*flutter)*(.42+energy*.72),bottom=top+length,rayColor={hue:(b.color.hue+(r%9===0?24:0)+360)%360,saturation:b.color.saturation,lightness:b.color.lightness},a=(.012+.105*energy)*edge*(.62+.38*Math.sin(r*.61+b.phase)**2);context.strokeStyle=hsl(rayColor,4,a);context.lineWidth=width/rays*1.35;context.beginPath();context.moveTo(x,top);context.lineTo(x+b.drift*length,bottom);context.stroke();if(r%3===0){context.strokeStyle=hsl(rayColor,18,a*.62);context.lineWidth=Math.max(.7,width/rays*.24);context.beginPath();context.moveTo(x,top);context.lineTo(x+b.drift*length*.75,top+length*.78);context.stroke()}}context.beginPath();for(let p=0;p<=48;p++){const nx=p/48,x=nx*width,wave=Math.sin(nx*Math.PI*2*b.frequency+b.phase)*b.waveA+Math.sin(nx*Math.PI*5.1+b.phase*.47)*b.waveB+Math.sin(nx*Math.PI*9.3-b.phase*.28)*5,y=b.y+wave;p?context.lineTo(x,y):context.moveTo(x,y)}context.strokeStyle=hsl(b.color,18,.18+.25*energy);context.lineWidth=2+energy*2.2;context.stroke()}}
function drawEqualizer(step){if(!eqBars.length)initEqualizer();context.globalCompositeOperation='source-over';const count=eqBars.length,pad=Math.max(18,width*.035),available=width-pad*2,gap=Math.max(3,available*.006),barW=(available-gap*(count-1))/count,segments=18,segGap=Math.max(2,height*.004),usableH=height*.72,segH=(usableH-segGap*(segments-1))/segments,baseY=height*.86;for(let i=0;i<count;i++){const b=eqBars[i];b.level+=(b.target-b.level)*.32*step;b.target*=Math.pow(.91,step);if(b.peakHold>0)b.peakHold-=step;else b.peak*=Math.pow(.965,step);b.peak=Math.max(b.peak,b.level);const active=Math.round(b.level*segments),peakSeg=Math.max(0,Math.min(segments-1,Math.round(b.peak*(segments-1)))),x=pad+i*(barW+gap);for(let s=0;s<segments;s++){const y=baseY-(s+1)*segH-s*segGap;if(s<active){const color=paletteColor(21+i*5+s);context.fillStyle=hsl(color,s>segments*.72?14:0,.94)}else context.fillStyle='rgba(255,255,255,.045)';context.fillRect(x,y,barW,segH)}if(b.peak>.035){const y=baseY-(peakSeg+1)*segH-peakSeg*segGap;context.fillStyle=hsl(b.color,22,.95);context.fillRect(x,y,barW,Math.max(2,segH*.42))}}}
function drawFireflies(step){if(!fireflies.length)initFireflies();context.globalCompositeOperation='lighter';for(const f of fireflies){if(Math.random()<.0025*step){f.targetVx=(Math.random()-.5)*.24;f.targetVy=(Math.random()-.5)*.18}if(Math.random()<.0018*step)f.flash=Math.min(1.15,f.flash+.3+Math.random()*.55);f.vx+=(f.targetVx-f.vx)*.012*step;f.vy+=(f.targetVy-f.vy)*.012*step;f.x+=f.vx*step;f.y+=f.vy*step;f.phase+=f.pulse*step;f.flash*=Math.pow(.965,step);if(f.x<-20)f.x=width+20;if(f.x>width+20)f.x=-20;if(f.y<height*.06){f.y=height*.06;f.targetVy=Math.abs(f.targetVy)}if(f.y>height*.94){f.y=height*.94;f.targetVy=-Math.abs(f.targetVy)}const breath=.5+.5*Math.sin(f.phase),alpha=Math.min(1,.025+f.base*breath+f.flash*.75),radius=f.size*(1+f.flash*.55),glow=radius*(5+f.flash*5);const g=context.createRadialGradient(f.x,f.y,0,f.x,f.y,glow);g.addColorStop(0,hsl(f.color,28,alpha));g.addColorStop(.14,hsl(f.color,16,alpha*.78));g.addColorStop(.45,hsl(f.color,2,alpha*.24));g.addColorStop(1,hsl(f.color,-8,0));context.fillStyle=g;context.beginPath();context.arc(f.x,f.y,glow,0,Math.PI*2);context.fill();context.fillStyle=hsl(f.color,34,Math.min(1,alpha*1.18));context.beginPath();context.arc(f.x,f.y,Math.max(.7,radius*.42),0,Math.PI*2);context.fill()}}
function animate(t){requestAnimationFrame(animate);if(t-lastFrameTime<15.5)return;const delta=lastFrameTime?Math.min(32,t-lastFrameTime):16.67,step=delta/16.67;lastFrameTime=t;context.globalCompositeOperation='source-over';const fade=visualizationMode==='lines'?.085:visualizationMode==='rain'?.11:visualizationMode==='aurora'?.12:visualizationMode==='equalizer'?1:visualizationMode==='fireflies'?.19:.12;context.fillStyle=`rgba(5,5,5,${fade})`;context.fillRect(0,0,width,height);if(visualizationMode==='lines')drawLines(step);else if(visualizationMode==='rain')drawRain(step);else if(visualizationMode==='aurora')drawAurora(step);else if(visualizationMode==='equalizer')drawEqualizer(step);else if(visualizationMode==='fireflies')drawFireflies(step);else drawSpots(step);context.globalCompositeOperation='source-over'}
